</head>
<body>

  <div id="login">
    <h2>🔐 Ingresa la contraseña</h2>
    <input type="password" id="password" placeholder="Contraseña">
    <br>        <link rel="stylesheet" href="floresamar.html" />
    <button onclick="checkPassword()">Entrar</button>
  </div>
  <script>
    const correctPassword = "Yaneidi";

    function checkPassword() {
      const pass = document.getElementById('password').value;
      if (pass === correctPassword) {
        document.getElementById('login').style.display = 'none';
        enviarotraclase();
      } else {
        alert("Contraseña incorrecta 🔐,  La Contraseña es tu Nombre Y la Primera Letra es Mayuscula");
      }

      function enviarotraclase(){
        window.location.href = "floresamar.html";
      }
    }
  </script>
  <div >
    <h1>Exclusivo Para Ti</h1>

  </div>

</body>
